name: Website checks

on:
  pull_request:
    branches: [main]

# Validation only: no secrets, write permissions, deployment or publishing.
permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  website-checks:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/website-check-env"
          echo "$RUNNER_TEMP/website-check-env/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/website-check-env/bin/python" -m pip install -r .github/checks/requirements.txt
      - name: Check HTML, internal links, images and metadata
        run: python .github/checks/check_site.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check desktop, mobile and JavaScript fallback
        run: python .github/checks/check_browser.py
